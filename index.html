  <body class="bg-[#FAF6EA] text-ink antialiased select-none overflow-x-hidden">
    <div id="root"></div>
    <div id="initial-page-loader" style="position:fixed;inset:0;top:0;left:0;right:0;bottom:0;width:100%;height:100%;min-height:100dvh;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background-color:#F8F1E1;font-family:'Nunito',sans-serif;user-select:none;transition:opacity 200ms ease-out;pointer-events:all;">
      <style>
        @keyframes initSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes initBounce { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-10px); } 75% { transform: translateY(10px); } }
        @media (prefers-reduced-motion: reduce) {
          .init-spin, .init-dot { animation: none !important; }
        }
      </style>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;max-width:390px;margin:auto;padding:0 24px;">
        <div style="position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;">
          <svg class="init-spin" style="position:absolute;inset:0;width:100%;height:100%;animation:initSpin 8s linear infinite;" viewBox="0 0 104 104">
            <circle cx="52" cy="52" r="50" fill="none" stroke="#17181B" stroke-width="1.5" stroke-dasharray="5.5 4.5" />
          </svg>
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;z-index:1;">
            <div id="init-dot-1" class="init-dot" style="width:16px;height:16px;border-radius:50%;background-color:#F9A6D2;animation:initBounce 900ms ease-in-out infinite 0ms;"></div>
            <div id="init-dot-2" class="init-dot" style="width:16px;height:16px;border-radius:50%;background-color:#9DBDFD;animation:initBounce 900ms ease-in-out infinite 150ms;"></div>
            <div id="init-dot-3" class="init-dot" style="width:16px;height:16px;border-radius:50%;background-color:#FEDF6B;animation:initBounce 900ms ease-in-out infinite 300ms;"></div>
          </div>
        </div>
        <div style="margin-top:28px;font-size:28px;font-weight:900;color:#17181B;letter-spacing:-0.02em;text-align:center;line-height:1.2;">
          Get-to-Know-You
        </div>
        <div style="margin-top:8px;font-size:15px;font-weight:700;color:rgba(23,24,27,0.55);letter-spacing:-0.01em;text-align:center;">
          Getting things ready…
        </div>
      </div>
      <script>
        (function() {
          var p = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '') || '/';
          var b = '#F8F1E1';
          var d1 = '#F9A6D2', d2 = '#9DBDFD', d3 = '#FEDF6B';
          if (p === '/create-profile' || p === '/invite' || p === '/join' || p === '/join-code' || p === '/countdown') {
            b = '#FEE36F'; d3 = '#F6EFDD';
          } else if (p === '/lobby' || p === '/locked' || p === '/answer-locked' || p === '/guess') {
            b = '#96B9FC'; d2 = '#F6EFDD';
          } else if (p === '/today-question') {
            b = '#F7C8E2'; d1 = '#F6EFDD';
          } else if (p === '/reveal' || p === '/game-final') {
            b = '#9BAE6F';
          }
          var el = document.getElementById('initial-page-loader');
          if (el) {
            el.style.backgroundColor = b;
            var dot1 = document.getElementById('init-dot-1');
            var dot2 = document.getElementById('init-dot-2');
            var dot3 = document.getElementById('init-dot-3');
            if (dot1) dot1.style.backgroundColor = d1;
            if (dot2) dot2.style.backgroundColor = d2;
            if (dot3) dot3.style.backgroundColor = d3;
          }
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
